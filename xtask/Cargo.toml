[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
clap = { version = "=4.6.0", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
testcontainers = { version = "=0.28.0", features = ["blocking"] }
walkdir = "=2.5.0"
