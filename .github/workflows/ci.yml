name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  MISE_JOBS: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: just ci-setup
      - run: just ci
        env:
          ARCANTRY_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
