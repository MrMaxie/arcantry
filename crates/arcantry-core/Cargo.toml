[package]
name = "arcantry-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
directories = "=6.0.0"
duct = "=1.1.1"
dunce = "=1.0.5"
fs4 = "=1.1.0"
jsonschema = { version = "=0.49.9", default-features = false, features = ["resolve-file"] }
junction = "=2.0.0"
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=1.1.0"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
todo-txt = "=4.2.1"
toml_edit = { version = "=0.25.13", features = ["serde"] }
url = "=2.5.8"
walkdir = "=2.5.0"

[dev-dependencies]
proptest = "=1.11.0"
