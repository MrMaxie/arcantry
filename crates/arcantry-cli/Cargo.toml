[package]
name = "arcantry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "arcantry"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
arcantry-core = { version = "=1.0.0", path = "../arcantry-core" }
chrono = "=0.4.45"
clap = { version = "=4.6.0", features = ["derive"] }
directories = "=6.0.0"
duct = "=1.1.1"
dunce = "=1.0.5"
fs4 = "=1.1.0"
junction = "=2.0.0"
rust-embed = "=8.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
walkdir = "=2.5.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
pulldown-cmark = "=0.13.4"
shell-words = "=1.1.1"
snapbox = "=1.2.2"
walkdir = "=2.5.0"

[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
walkdir = "=2.5.0"
